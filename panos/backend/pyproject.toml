[project]
name = "panos-api"
version = "0.1.0"
description = "FastAPI backend for PanOS"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16.0",
  "asyncpg>=0.30.0",
  "fastapi>=0.115.0",
  "pillow>=12.2.0",
  "psycopg2-binary>=2.9.12",
  "pydantic-settings>=2.8.0",
  "pyjwt[crypto]>=2.10.0",
  "python-multipart>=0.0.20",
  "sqlalchemy[asyncio]>=2.0.0",
  "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28.0",
  "mypy>=1.16.0",
  "pytest>=8.4.0",
  "pytest-asyncio>=1.0.0",
  "ruff>=0.11.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100
# Alembic 自动生成的迁移文件不参与严格 lint。
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 依赖注入惯用法：Depends/Query/Path 等作为默认值是有意为之，不算 B008。
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.File"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]
strict = true
warn_unreachable = true
show_error_codes = true
exclude = ["app/db/migrations/versions/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

